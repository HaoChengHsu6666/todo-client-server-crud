// src/app/login/login.component.html
// 登入組件的 HTML 模板
<div class="login-container">
  <form (ngSubmit)="login()" class="login-form">
    <div class="form-group">
      <label for="username">帳號：</label>
      <!-- 新增 input 事件監聽 -->
      <input
        [(ngModel)]="username"
        (input)="onInputChange()" 
        name="username"
        id="username"
        placeholder="請輸入帳號"
        required />
    </div>

    <div class="form-group">
      <label for="password">密碼：</label>
      <!-- 新增 input 事件監聽 -->
      <input
        [(ngModel)]="password"
        (input)="onInputChange()" 
        type="password"
        name="password"
        id="password"
        placeholder="請輸入密碼"
        required />
    </div>

    <button type="submit" class="login-button">登入</button>
    <p *ngIf="loginFailed" class="error-message">帳號或密碼錯誤!!!</p>
  </form>
</div>
